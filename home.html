<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kisaragi Academy - Student Portal</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="classroom">
            <header>
                <div class="school-name">KISARAGI ACADEMY</div>
                <div class="portal-name">CLASSROOM 2-B</div>
            </header>
            <section class="classroom-scene">
                <div class="blackboard">
                    <p>KISARAGI ACADEMY</p>
                    <span>SEPTEMBER 22, 2011</span>
                </div>
                <div class="teacher">
                    <p>MS. KURODA</p>
                </div>
                <div class="desks">
                    <div class="desk-row">
                        <div class="deak">
                            <span>01</span>
                        </div>
                        <div class="desk">
                            <span>02</span>
                        </div>
                        <div class="desk">
                            <span>03</span>
                        </div>
                    </div>
                    <div class="desk-row">
                        <div class="desk">
                            <span>04</span>
                        </div>
                        <div class="desk" id="desk05">
                            <span>05</span>
                        </div>
                    </div>
                </div>
            </section>
            <section class="dialogue">
                <div class="speaker" id="speaker">
                    MS. KURODA
                </div>
                <p id="dialogueText">
                    Good morning, everyone.
                </p>
                <button id="continueButton" type="button">
                    CONTINUE
                </button>
            </section>
            <p class="interaction" id="instruction"></p>
            <p class="messsage" id="message"></p>
        </main>
        <script src="script.js"></script>
    </body>
</html>
